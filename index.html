<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    html, body {
      background-color: #191919 !important;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  
  .container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    width: 100%;
    height: 100vh;
    box-sizing: border-box;
    padding: 8px;
  }

  .card {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border-radius: 12px;
    font-weight: 600;
    font-size: 18px;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid #e2e8f0;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
  }
  
  .fide {
    background-color: #eaeef3 !important;
    border: none;
  }
  .kcf {
    background-color: #ffffff;
  }
  
  .chesscom {
    background-color: #312E2B !important;
    color: white;
    border: none;
  }
  .lichess {
    background-color: hsl(37, 10%, 92%) !important;
    font-family: "Noto Sans", sans-serif;
    font-size: 30px;
    border: none;
    text-shadow: 0 1px 0 white;
  }
  .lichess-text {
    color: #4D4D4D;
    margin-left: 7px; 
  }
  .org-text {
    color: #787878;
  }
  
  .logo {
    height: 43px;
    max-width: 90%;
    object-fit: contain;
  }

  @media (prefers-color-scheme: dark) {
    .fide, .kcf {
      background-color: #2a2a2a !important; 
      border-color: #404040;
    }
  }

  @media (max-width: 768px) {
    .container {
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }
  }

  @media (max-width: 480px) {
    .lichess {
      font-size: 18px;
    }
    .lichess-text {
      margin-left: 4.2px;
    }
    .logo {
      height: 25.8px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <a href="https://www.fide.com/" target="_blank" class="card fide">
      <img src="images/fidelogo.png" alt="FIDE" class="logo">
    </a>
    <a href="http://www.kchess.or.kr/" target="_blank" class="card kcf">
      <img src="images/kcflogo.png" alt="대한체스연맹" class="logo">
    </a>
    <a href="https://www.chess.com" target="_blank" class="card chesscom">
      <img src="images/chesscomlogo.png" alt="Chess.com" class="logo">
    </a>
    <a href="https://lichess.org" target="_blank" class="card lichess">
      <img src="images/lichesslogo.png" alt="Lichess" class="logo">
      <span class="lichess-text">lichess</span><span class="org-text">.org</span>
    </a>
  </div>
</body>
</html>
