<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400&family=Roboto:wght@300;700&display=swap" rel="stylesheet">
<style>
  :root {
    --scale: calc(100vw / 1200);
  }

  html, body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    html, body {
      background-color: #191919 !important;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  
  .container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: calc(16 * var(--scale));
    width: 100%;
    height: 100vh;
    box-sizing: border-box;
    padding: calc(8 * var(--scale));
  }

  .card {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    border-radius: calc(12 * var(--scale));
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid #e2e8f0;
  }
  .card:hover {
    transform: translateY(calc(-4 * var(--scale)));
    box-shadow: 0 calc(6 * var(--scale)) calc(12 * var(--scale)) rgba(0,0,0,0.15);
  }
  
  .fide {
    background-color: #eaeef3 !important;
    border: none;
  }
  
  .fide-text {
    color: #24305E;
    font-family: "Roboto", sans-serif;
    font-weight: 300;
    font-size: calc(14.3 * var(--scale));
    line-height: calc(16.7 * var(--scale));
    padding-left: calc(11.9 * var(--scale));
    text-align: left;
  }
  .fide-text strong {
    font-weight: 700;
  }

  .kcf {
    background-color: #ffffff !important;
  }
  
  .chesscom {
    background-color: #312E2B !important;
    color: white;
    border: none;
  }
  
  .lichess {
    background-color: hsl(37, 10%, 92%) !important;
    font-family: "Noto Sans", sans-serif;
    font-size: calc(30 * var(--scale));
    line-height: calc(41 * var(--scale));
    border: none;
    text-shadow: 0 calc(1px * var(--scale)) 0 white;
  }
  .lichess-text {
    color: #4D4D4D;
    padding-left: calc(10.5 * var(--scale)); 
  }
  .org-text {
    color: #787878;
  }
  
  .logo {
    height: calc(43 * var(--scale));
    max-width: 90%;
    object-fit: contain;
  }

  @media (max-width: 480px) {
    :root {
      --scale: calc(100vw / 600);
    }
    .container {
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
    }
  }
</style>
</head>
<body>
  <div class="container">
    <a href="https://www.fide.com/" target="_blank" class="card fide">
      <img src="images/fidelogo.png" alt="FIDE" class="logo">
      <div class="fide-text">
        International<br>
        <strong>Chess Federation</strong>
      </div>
    </a>
    <a href="http://www.kchess.or.kr/" target="_blank" class="card kcf">
      <img src="images/kcflogo.png" alt="대한체스연맹" class="logo">
    </a>
    <a href="https://www.chess.com" target="_blank" class="card chesscom">
      <img src="images/chesscomlogo.png" alt="Chess.com" class="logo">
    </a>
    <a href="https://lichess.org" target="_blank" class="card lichess">
      <img src="images/lichesslogo.png" alt="Lichess" class="logo">
      <span class="lichess-text">lichess</span><span class="org-text">.org</span>
    </a>
  </div>
</body>
</html>
